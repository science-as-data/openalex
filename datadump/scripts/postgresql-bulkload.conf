# Temporary bulk-load tuning for the OpenAlex import.
#
# Install as a conf.d drop-in and reload, run the load, then REMOVE it and
# reload again to return to normal operating settings:
#
#   sudo cp postgresql-bulkload.conf /etc/postgresql/18/main/conf.d/
#   sudo systemctl reload postgresql
#   ./load.sh                                  # run the import
#   sudo rm /etc/postgresql/18/main/conf.d/postgresql-bulkload.conf
#   sudo systemctl reload postgresql
#
# Tuned for the observed host: 24 cores, 125 GB RAM, fast SSD. These favour
# raw load throughput over crash safety / concurrency -- fine for a rebuildable
# derived database, NOT settings to leave on a production system.

shared_buffers = 16GB
work_mem = 256MB
maintenance_work_mem = 8GB           # big index builds after the load
max_wal_size = 64GB
min_wal_size = 2GB
checkpoint_timeout = 60min
checkpoint_completion_target = 0.9
wal_compression = on
autovacuum = off                     # re-enable after load, then VACUUM ANALYZE
synchronous_commit = off
max_worker_processes = 24
max_parallel_workers = 24
max_parallel_workers_per_gather = 8
max_parallel_maintenance_workers = 8
effective_cache_size = 96GB
